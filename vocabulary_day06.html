<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vocabulary 101 · Day 06</title><style>
:root{color-scheme:light dark;--bg:#f7f8fb;--card:#fff;--text:#17191f;--muted:#6b7280;--line:#e5e7eb;--accent:#6757ff;--good:#16a34a;--bad:#dc2626}
@media(prefers-color-scheme:dark){:root{--bg:#101216;--card:#1b1f26;--text:#f8fafc;--muted:#aab0bb;--line:#303640}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:760px;margin:auto;padding:22px}
header{margin:14px 0 22px}.eyebrow{font-weight:800;letter-spacing:.12em;color:var(--accent)}h1{font-size:36px;margin:7px 0}.sub{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin:14px 0}.word{font-size:31px;font-weight:850}.syn{font-size:18px;color:var(--accent);font-weight:750;margin:6px 0 14px}.example{font-size:18px;line-height:1.55}button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:13px;padding:13px;cursor:pointer}button:hover{border-color:var(--accent)}.controls{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}.primary{background:var(--accent);color:white;border-color:var(--accent)}.hidden{display:none}.progress{height:9px;background:var(--line);border-radius:99px;overflow:hidden}.bar{height:100%;background:var(--accent);width:0}.option{display:block;width:100%;text-align:left;margin:9px 0}.wrong{border-color:var(--bad)}.correct{border-color:var(--good)}#feedback{min-height:48px;margin:12px 0;font-weight:700}.small{color:var(--muted);font-size:14px}
</style></head><body><main><header><div class="eyebrow">VOCABULARY 101 · DAY 06</div><h1>Learn → Quiz</h1><div class="sub">36 words · English-first practice</div></header>
<div class="progress"><div class="bar" id="bar"></div></div>
<section class="card" id="learn"><div class="small" id="counter"></div><div class="word" id="word"></div><div class="syn" id="syn"></div><div class="example" id="example"></div><div class="controls"><button id="prev">← Previous</button><button class="primary" id="next">Next →</button></div></section>
<section class="card hidden" id="quiz"><div class="small" id="qcount"></div><h2 id="question"></h2><div id="options"></div><div id="feedback"></div><button class="primary hidden" id="qnext">Next →</button></section>
<section class="card hidden" id="result"><h2>Day 06 Complete 🎉</h2><p id="score"></p><h3>Weak Words</h3><div id="weak"></div><div class="controls"><button class="primary" onclick="location.reload()">Practice Again</button></div></section>
</main><script>
const words=[{"w": "abominable", "k": "지긋지긋한", "s": "hateful", "e": "The committee condemned the abominable treatment of the animals."}, {"w": "alacrity", "k": "활발", "s": "liveliness", "e": "She accepted the new challenge with alacrity."}, {"w": "aroma", "k": "향기", "s": "fragrance", "e": "The aroma of fresh bread filled the kitchen."}, {"w": "biased", "k": "선입견이 있는", "s": "prejudiced", "e": "A judge must avoid making a biased decision."}, {"w": "cantankerous", "k": "심술궂은", "s": "contentious", "e": "The cantankerous neighbor complained about every little noise."}, {"w": "commencement", "k": "시작", "s": "start", "e": "The commencement of the ceremony was delayed by rain."}, {"w": "convert", "k": "바꾸다", "s": "switch", "e": "They plan to convert the old warehouse into apartments."}, {"w": "defunct", "k": "사용되지 않는", "s": "extinct", "e": "The defunct company has not operated for years."}, {"w": "degenerate", "k": "퇴보하다", "s": "worsen", "e": "Without maintenance, the building may degenerate rapidly."}, {"w": "diction", "k": "어법", "s": "choice of words", "e": "The poet's precise diction gives the poem a formal tone."}, {"w": "empathy", "k": "공감", "s": "understanding", "e": "A good counselor listens with empathy."}, {"w": "evade", "k": "피하다", "s": "avoid", "e": "The suspect tried to evade the difficult question."}, {"w": "far-fetched", "k": "믿기지 않는", "s": "unlikely", "e": "His explanation sounded too far-fetched to be believable."}, {"w": "hangar", "k": "격납고", "s": "garage", "e": "The aircraft was moved into the hangar for repairs."}, {"w": "hypnotize", "k": "최면을 걸다", "s": "spellbind", "e": "The performer claimed he could hypnotize volunteers."}, {"w": "inadvertent", "k": "고의가 아닌", "s": "unintentional", "e": "An inadvertent error caused the wrong file to be sent."}, {"w": "infringe", "k": "어기다", "s": "violate", "e": "The new rule must not infringe individual rights."}, {"w": "intimate", "k": "암시하다", "s": "imply", "e": "Her expression seemed to intimate that something was wrong."}, {"w": "kindred", "k": "관련된", "s": "related", "e": "The two researchers discovered kindred interests."}, {"w": "lineage", "k": "혈통", "s": "pedigree", "e": "The document traces the family's lineage for centuries."}, {"w": "marginal", "k": "미미한", "s": "slight", "e": "The change produced only a marginal improvement."}, {"w": "moderate", "k": "절제 있는", "s": "temperate", "e": "Regular exercise and a moderate diet can support good health."}, {"w": "nomad", "k": "유목민", "s": "wanderer", "e": "The nomad traveled from place to place with his herd."}, {"w": "ornate", "k": "화려하게 장식한", "s": "fancy", "e": "The palace was decorated with ornate ceilings."}, {"w": "paradigm", "k": "전형적인 예", "s": "example", "e": "This case became a paradigm of successful cooperation."}, {"w": "prelude", "k": "서곡", "s": "introduction", "e": "The short speech was a prelude to the main announcement."}, {"w": "quarry", "k": "사냥감", "s": "game", "e": "The hunters followed their quarry through the forest."}, {"w": "repudiate", "k": "거절하다", "s": "disclaim", "e": "The organization moved quickly to repudiate the false claim."}, {"w": "ruthless", "k": "무자비한", "s": "cruel", "e": "The ruthless ruler showed no mercy to his opponents."}, {"w": "shed", "k": "오두막", "s": "hovel", "e": "They spent the afternoon repairing the wooden shed."}, {"w": "speculate", "k": "사색하다", "s": "conjecture", "e": "Analysts continue to speculate about the cause of the change."}, {"w": "stunning", "k": "굉장히 멋진", "s": "marvelous", "e": "The mountain view was absolutely stunning."}, {"w": "teem", "k": "충만하다", "s": "swarm", "e": "In spring, the pond can teem with tiny creatures."}, {"w": "trot", "k": "빠른 걸음으로 가다", "s": "jog", "e": "The horse began to trot along the path."}, {"w": "verbalize", "k": "말로 표현하다", "s": "communicate", "e": "It can be difficult to verbalize complex emotions."}, {"w": "xenophobia", "k": "이방인 공포증", "s": "fear of strangers", "e": "Education can help challenge fear and xenophobia."}];let i=0,qs=[],qi=0,score=0,weak=[],$=x=>document.getElementById(x);
function showWord(){let x=words[i];$('counter').textContent=`Word ${i+1} / ${words.length}`;$('word').textContent=x.w;$('syn').textContent=`≈ ${x.s}`;$('example').textContent=x.e;$('bar').style.width=((i+1)/words.length*50)+'%';$('prev').disabled=i===0;$('next').textContent=i===words.length-1?'Start Quiz →':'Next →'}
$('prev').onclick=()=>{if(i){i--;showWord()}};$('next').onclick=()=>{if(i<words.length-1){i++;showWord()}else startQuiz()};
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function startQuiz(){$('learn').classList.add('hidden');$('quiz').classList.remove('hidden');qs=shuffle(words).slice(0,18);renderQ()}
function renderQ(){let x=qs[qi];$('qcount').textContent=`Question ${qi+1} / ${qs.length}`;$('question').textContent=`Which word is closest in meaning to “${x.s}”?`;$('feedback').textContent='';$('qnext').classList.add('hidden');let ds=shuffle(words.filter(y=>y.w!==x.w)).slice(0,3),opts=shuffle([x,...ds]);$('options').innerHTML='';opts.forEach(o=>{let b=document.createElement('button');b.className='option';b.textContent=o.w;b.onclick=()=>answer(b,o,x);$('options').appendChild(b)});$('bar').style.width=(50+(qi/qs.length*50))+'%'}
function answer(b,o,x){if(b.disabled)return;if(o.w===x.w){score++;[...$('options').children].forEach(z=>z.disabled=true);b.classList.add('correct');$('feedback').textContent=`Correct! ${x.w} — ${x.k}`;$('qnext').classList.remove('hidden')}else{b.disabled=true;b.classList.add('wrong');weak.push(x.w);$('feedback').textContent=`Not quite. “${o.w}” means “${o.k}”. Try again.`}}
$('qnext').onclick=()=>{qi++;if(qi<qs.length)renderQ();else finish()};function finish(){$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('bar').style.width='100%';$('score').textContent=`Score: ${score} / ${qs.length}`;let u=[...new Set(weak)];$('weak').innerHTML=u.length?u.map(w=>{let x=words.find(z=>z.w===w);return `<p><b>${x.w}</b> · ${x.s} · ${x.k}</p>`}).join(''):'<p>No weak words — excellent!</p>'}showWord();
</script></body></html>
