<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vocabulary 101 · 60-Day Challenge</title>
<style>
:root{color-scheme:light dark;--bg:#f7f8fb;--text:#17191f;--muted:#6b7280;--card:#fff;--border:#e5e7eb;--soft:#f3f4f6;--accent:#6b57ff;--green:#22c55e;--gold:#f59e0b}
@media(prefers-color-scheme:dark){:root{--bg:#111317;--text:#f8fafc;--muted:#aeb4c0;--card:#1b1f26;--border:#2b3038;--soft:#252a32}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{padding:24px}.wrap{max-width:920px;margin:auto}.hero{padding:28px 0 20px}.eyebrow{font-size:13px;font-weight:800;letter-spacing:.12em;color:var(--accent);text-transform:uppercase}
h1{font-size:38px;margin:8px 0 4px}.sub{color:var(--muted);font-size:16px}.progress-card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px;margin:18px 0 22px}
.progress-row{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}.progress{height:10px;background:var(--soft);border-radius:999px;overflow:hidden;margin-top:12px}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),#3da8ff)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;min-height:108px;transition:.15s}
.available:hover,.review:hover{transform:translateY(-2px);border-color:var(--accent)}.num{font-size:13px;color:var(--muted);font-weight:800}.label{font-size:18px;font-weight:850}.status{font-size:13px;font-weight:750}.available .status{color:var(--green)}
.review{border:2px solid var(--gold);background:linear-gradient(145deg,var(--card),rgba(245,158,11,.10));grid-column:auto}.review .num,.review .status{color:var(--gold)}
.locked{opacity:.58;cursor:not-allowed;background:var(--soft)}.tip{margin:20px 0;color:var(--muted);font-size:14px;line-height:1.6}
.error{background:var(--card);border:1px solid var(--border);padding:16px;border-radius:14px;color:var(--muted)}
@media(max-width:760px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:520px){.app{padding:16px}h1{font-size:31px}.grid{grid-template-columns:repeat(2,1fr)}.card{min-height:96px}}
</style>
</head>
<body>
<div class="app"><div class="wrap">
<section class="hero">
<div class="eyebrow">American College Vocabulary 101</div>
<h1>60-Day Challenge</h1>
<div class="sub">One day at a time. Learn, quiz, recall, review.</div>
</section>
<section class="progress-card">
<div class="progress-row"><div><strong>Current release</strong><div class="sub" id="releaseText">Loading…</div></div><strong id="releaseCount">— / 60</strong></div>
<div class="progress"><div class="bar" id="bar"></div></div>
</section>
<section class="grid" id="days"></section>
<p class="tip">Complete each five-day block, then take the Review Challenge. New lessons unlock as they are released.</p>
</div></div>
<script>
(async()=>{
 const grid=document.getElementById('days');
 try{
   // Cache-busting query ensures the newest release settings are fetched.
   const res=await fetch('release.json?v='+Date.now(),{cache:'no-store'});
   if(!res.ok) throw new Error('release.json not found');
   const cfg=await res.json();
   const released=Math.max(0,Math.min(60,Number(cfg.releasedDay)||0));
   const reviews=Array.isArray(cfg.reviews)?cfg.reviews:[];
   document.getElementById('releaseText').textContent=`Day 01–${String(released).padStart(2,'0')} available`;
   document.getElementById('releaseCount').textContent=`${released} / 60`;
   document.getElementById('bar').style.width=(released/60*100)+'%';

   function addLesson(i){
     const d=String(i).padStart(2,'0');
     if(i<=released){
       const a=document.createElement('a');
       a.className='card available';
       a.href=`vocabulary_day${d}.html`;
       a.innerHTML=`<div class="num">DAY ${d}</div><div class="label">START</div><div class="status">● Available</div>`;
       grid.appendChild(a);
     }else{
       const x=document.createElement('div');
       x.className='card locked';
       x.innerHTML=`<div class="num">DAY ${d}</div><div class="label">LOCKED</div><div class="status">🔒 Coming soon</div>`;
       grid.appendChild(x);
     }
   }

   function addReview(r){
     const a=document.createElement('a');
     a.className='card review';
     a.href=r.file;
     a.innerHTML=`<div class="num">⭐ ${r.title}</div><div class="label">REVIEW CHALLENGE</div><div class="status">${r.subtitle||'Start Review →'}</div>`;
     grid.appendChild(a);
   }

   for(let i=1;i<=60;i++){
     addLesson(i);
     reviews.filter(r=>Number(r.afterDay)===i).forEach(addReview);
   }
 }catch(e){
   grid.innerHTML='<div class="error">The release settings could not be loaded. Please check that <strong>release.json</strong> is uploaded beside index.html.</div>';
   document.getElementById('releaseText').textContent='Settings unavailable';
 }
})();
</script>
</body>
</html>
