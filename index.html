<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vocabulary 101 · 60-Day Challenge</title>
<style>
  :root{
    color-scheme: light dark;
    --bg:#f7f8fb; --text:#17191f; --muted:#6b7280; --card:#ffffff; --border:#e5e7eb;
    --soft:#f3f4f6; --accent:#6b57ff; --green:#22c55e; --lock:#9ca3af;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#111317; --text:#f8fafc; --muted:#aeb4c0; --card:#1b1f26; --border:#2b3038;
      --soft:#252a32; --lock:#6b7280;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  .app{padding:24px}
  .wrap{max-width:920px;margin:0 auto}
  .hero{padding:28px 0 20px}
  .eyebrow{font-size:13px;font-weight:800;letter-spacing:.12em;color:var(--accent);text-transform:uppercase}
  h1{font-size:38px;margin:8px 0 4px;line-height:1.05}
  .sub{color:var(--muted);font-size:16px}
  .progress-card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px;margin:18px 0 22px}
  .progress-row{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}
  .progress{height:10px;background:var(--soft);border-radius:999px;overflow:hidden;margin-top:12px}
  .bar{height:100%;width:5%;background:linear-gradient(90deg,var(--accent),#3da8ff)}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .day{
    display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit;
    background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;min-height:108px;
    transition:transform .15s ease,border-color .15s ease;
  }
  .day.available:hover{transform:translateY(-2px);border-color:var(--accent)}
  .num{font-size:13px;color:var(--muted);font-weight:800}
  .label{font-size:18px;font-weight:850}
  .status{font-size:13px;font-weight:750}
  .available .status{color:var(--green)}
  .locked{opacity:.62;cursor:not-allowed;background:var(--soft)}
  .locked .status{color:var(--lock)}
  .tip{margin:20px 0;color:var(--muted);font-size:14px;line-height:1.6}
  @media(max-width:760px){.grid{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:520px){
    .app{padding:16px}
    h1{font-size:31px}
    .grid{grid-template-columns:repeat(2,1fr)}
    .day{min-height:96px}
  }
</style>
</head>
<body>
<div class="app">
  <div class="wrap">
    <section class="hero">
      <div class="eyebrow">American College Vocabulary 101</div>
      <h1>60-Day Challenge</h1>
      <div class="sub">One day at a time. Learn, quiz, recall, review.</div>
    </section>

    <section class="progress-card">
      <div class="progress-row">
        <div>
          <strong>Current release</strong>
          <div class="sub">Day 01–03 available</div>
        </div>
        <strong>3 / 60</strong>
      </div>
      <div class="progress"><div class="bar"></div></div>
    </section>

    <section class="grid" id="days"></section>

    <p class="tip">Day 04 onward will unlock as new lessons are added. Bookmark this page and return here each day.</p>
  </div>
</div>

<script>
(() => {
  const grid = document.getElementById('days');
  for(let i=1;i<=60;i++){
    const day = String(i).padStart(2,'0');
    if(i<=3){
      const a=document.createElement('a');
      a.className='day available';
      a.href=`vocabulary_day${day}.html`;
      a.innerHTML=`<div class="num">DAY ${day}</div><div class="label">START</div><div class="status">● Available</div>`;
      grid.appendChild(a);
    } else {
      const d=document.createElement('div');
      d.className='day locked';
      d.setAttribute('aria-disabled','true');
      d.innerHTML=`<div class="num">DAY ${day}</div><div class="label">LOCKED</div><div class="status">🔒 Coming soon</div>`;
      grid.appendChild(d);
    }
  }
})();
</script>
</body>
</html>
