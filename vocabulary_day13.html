<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vocabulary 101 · Day 13</title>
<style>
:root{color-scheme:light dark;--bg:#f7f8fb;--text:#17191f;--muted:#666b76;--card:#fff;--border:#e5e8ef;--soft:#f2f4f7;--soft2:#eef0f5;--accent:#6b57ff;--accent2:#3da8ff;--good:#2ca35f;--goodbg:#dff7e6;--bad:#d5535c;--badbg:#fde4e6}
@media(prefers-color-scheme:dark){:root{--bg:#111317;--text:#f6f7f9;--muted:#aeb4c0;--card:#1b1f26;--border:#2b3038;--soft:#252a32;--soft2:#292e36;--goodbg:#173d25;--badbg:#4a1d22}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{padding:24px}.wrap{max-width:860px;margin:0 auto}.top{display:flex;justify-content:space-between;gap:14px;align-items:flex-end;flex-wrap:wrap;margin-bottom:18px}
h1{margin:0;font-size:28px;line-height:1.1}.sub{color:var(--muted);margin-top:6px;font-size:14px}.progress{height:10px;background:var(--border);border-radius:999px;overflow:hidden;margin:10px 0 22px}
.bar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .25s ease}.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:22px;margin-bottom:16px;box-shadow:0 8px 24px rgba(0,0,0,.05)}
.pill{display:inline-flex;align-items:center;padding:6px 10px;border-radius:999px;background:var(--soft2);font-size:12px;font-weight:700;color:var(--muted)}.word{font-size:36px;font-weight:800;margin:12px 0 6px;letter-spacing:-.02em}
.meaning{font-size:18px;font-weight:700;margin-bottom:4px}.syn{color:var(--muted);font-size:14px;margin-bottom:16px}.example{font-size:17px;line-height:1.6;padding:16px;border-radius:14px;background:var(--soft);margin:12px 0}.note{font-size:14px;color:var(--muted)}
button{appearance:none;border:none;border-radius:14px;padding:13px 16px;font-size:15px;font-weight:750;cursor:pointer;min-height:44px}button:disabled{opacity:.55;cursor:not-allowed}.primary{background:var(--accent);color:#fff}.secondary{background:var(--soft2);color:var(--text)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.option{background:var(--soft);color:var(--text);text-align:left;border:1px solid transparent}.option.correct{background:var(--goodbg);border-color:var(--good)}.option.wrong{background:var(--badbg);border-color:var(--bad)}
.feedback{margin-top:14px;font-size:14px;line-height:1.5;min-height:22px}input{width:100%;border:1px solid var(--border);background:var(--card);color:var(--text);padding:14px 15px;border-radius:14px;font-size:17px;outline:none}input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(107,87,255,.12)}
.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{padding:9px 12px;border-radius:12px;background:var(--soft2);font-size:13px;font-weight:700}.hidden{display:none!important}.center{text-align:center}.bigscore{font-size:54px;font-weight:900;margin:10px 0}
.review-list{display:grid;gap:8px;margin-top:16px}.review-item{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:12px;background:var(--soft);font-size:14px}
@media(max-width:600px){.app{padding:16px}.options{grid-template-columns:1fr}.word{font-size:31px}.card{padding:18px}}
</style>
</head>
<body>
<div class="app"><div class="wrap">
<div class="top"><div><span class="pill">60-Day Challenge · Day 13</span><h1>Vocabulary Mission</h1><div class="sub">36 words · Learn → Quiz → Recall → Review</div></div>
<div class="stats"><div class="stat" id="stepStat">Step 1</div><div class="stat" id="scoreStat">Score 0</div></div></div>
<div class="progress"><div class="bar" id="bar"></div></div>

<section id="learn" class="card"><span class="pill" id="learnCount"></span><div class="word" id="word"></div><div class="meaning" id="meaning"></div><div class="syn" id="syn"></div><div class="example" id="example"></div><div class="note" id="note"></div>
<div class="actions"><button class="secondary" id="prevBtn" type="button">← Previous</button><button class="primary" id="nextBtn" type="button">Next →</button></div></section>

<section id="quiz" class="card hidden"><span class="pill" id="quizCount"></span><div class="word" style="font-size:24px" id="question"></div><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="primary hidden" id="quizNext" type="button">Next question →</button></div></section>

<section id="recall" class="card hidden"><span class="pill" id="recallCount"></span><div class="word" style="font-size:24px" id="recallPrompt"></div><div class="sub" style="margin:0 0 14px">Type the English word.</div>
<form id="recallForm"><input id="recallInput" autocomplete="off" spellcheck="false" placeholder="Type your answer"><div class="actions"><button class="primary" type="submit">Check</button></div></form>
<div class="feedback" id="recallFeedback" aria-live="polite"></div><div class="actions"><button class="secondary hidden" id="recallNext" type="button">Next →</button></div></section>

<section id="result" class="card hidden center"><span class="pill">DAY 13 COMPLETE</span><div class="bigscore" id="finalScore">0%</div><div class="meaning" id="resultText"></div><div class="sub">틀린 단어는 아래에서 바로 다시 확인할 수 있어요.</div><div class="review-list" id="reviewList"></div><div class="actions" style="justify-content:center"><button class="primary" id="restart" type="button">Restart Day 13</button></div></section>
</div></div>

<script>
(()=>{
const words=[{"w": "absurd", "k": "터무니없는", "s": "ridiculous", "e": "The idea seemed absurd at first.", "n": "논리나 상식에 맞지 않을 만큼 터무니없는 것을 뜻해요."}, {"w": "alliance", "k": "동맹", "s": "union", "e": "The two countries formed a military alliance.", "n": "공통 목적을 위해 맺는 동맹이나 협력 관계를 뜻해요."}, {"w": "assertive", "k": "자기 주장이 강한", "s": "self-assured", "e": "She was assertive without being rude.", "n": "자신의 의견이나 권리를 분명하고 자신 있게 표현하는 태도예요."}, {"w": "blasé", "k": "심드렁한", "s": "bored", "e": "He seemed blasé about the exciting news.", "n": "너무 익숙해져 흥미나 감동을 느끼지 못하는 태도를 뜻해요."}, {"w": "celerity", "k": "민첩함", "s": "swiftness", "e": "The team responded with remarkable celerity.", "n": "매우 빠르고 민첩하게 움직이는 것을 뜻해요."}, {"w": "compatible", "k": "잘 어울릴 수 있는", "s": "harmonious", "e": "The two software systems are fully compatible.", "n": "서로 충돌하지 않고 함께 잘 작동하거나 어울리는 뜻이에요."}, {"w": "devout", "k": "독실한", "s": "pious", "e": "She was a devout member of the community.", "n": "종교적 신앙이 매우 깊고 성실한 태도를 뜻해요."}, {"w": "dilute", "k": "묽게 하다", "s": "thin", "e": "Add water to dilute the solution.", "n": "액체에 다른 물질을 섞어 농도를 낮추는 뜻이에요."}, {"w": "dogmatic", "k": "독단적인", "s": "dictatorial", "e": "He was criticized for his dogmatic views.", "n": "자신의 생각만 옳다고 믿고 다른 의견을 받아들이지 않는 태도예요."}, {"w": "encumber", "k": "방해하다", "s": "hamper", "e": "Heavy luggage encumbered their journey.", "n": "짐이나 문제 등이 움직임이나 진행을 방해하는 뜻이에요."}, {"w": "exalt", "k": "위로 떠받들다", "s": "glorify", "e": "The poem exalts courage and loyalty.", "n": "사람이나 가치를 매우 높이 평가하고 칭송하는 뜻이에요."}, {"w": "fetch", "k": "가지고 오다", "s": "return with", "e": "Please fetch the documents from the office.", "n": "어딘가에 가서 물건이나 사람을 데려오거나 가져오는 뜻이에요."}, {"w": "formidable", "k": "무서운", "s": "horrible", "e": "They faced a formidable opponent in the final.", "n": "강력하거나 어려워 상대하기 두려운 대상을 뜻해요."}, {"w": "glance", "k": "힐끗 보다", "s": "glimpse", "e": "She glanced at the clock before leaving.", "n": "아주 짧게 또는 빠르게 바라보는 뜻이에요."}, {"w": "hapless", "k": "불운한", "s": "unlucky", "e": "The hapless traveler lost his passport and wallet.", "n": "불운해서 계속 좋지 않은 일을 겪는 사람을 나타내요."}, {"w": "ignorance", "k": "무지", "s": "unawareness", "e": "The mistake was caused by ignorance of the rules.", "n": "필요한 지식이나 정보를 알지 못하는 상태를 뜻해요."}, {"w": "incendiary", "k": "방화의", "s": "inflammatory", "e": "The speech contained incendiary language.", "n": "불을 일으키는 것 또는 갈등을 격화시키는 자극적인 것을 뜻해요."}, {"w": "inhumane", "k": "비인간적인", "s": "brutal", "e": "The prisoners were kept in inhumane conditions.", "n": "사람답지 않을 정도로 잔인하고 비정한 것을 뜻해요."}, {"w": "intuition", "k": "직감", "s": "instinct", "e": "Her intuition told her that something was wrong.", "n": "논리적 추론 없이 즉각적으로 느끼거나 판단하는 능력을 뜻해요."}, {"w": "knotty", "k": "복잡한", "s": "complex", "e": "The committee struggled with a knotty problem.", "n": "해결하기 어렵고 복잡하게 얽힌 문제를 나타내요."}, {"w": "literal", "k": "글자대로의", "s": "exact", "e": "The literal meaning of the phrase is quite different.", "n": "비유가 아니라 단어의 실제·직접적인 의미를 뜻해요."}, {"w": "milieu", "k": "(사회적) 환경", "s": "surroundings", "e": "The artist grew up in a creative milieu.", "n": "사람에게 영향을 주는 사회적·문화적 환경을 뜻해요."}, {"w": "notable", "k": "유명한", "s": "renowned", "e": "She made a notable contribution to the field.", "n": "눈에 띄고 중요하거나 유명한 것을 뜻해요."}, {"w": "outpost", "k": "전초지", "s": "frontier", "e": "The soldiers established an outpost near the border.", "n": "중심지에서 떨어진 작은 기지나 전초 지역을 뜻해요."}, {"w": "perpetrate", "k": "나쁜 짓을 범하다", "s": "commit", "e": "The group was accused of perpetrating fraud.", "n": "범죄나 잘못된 행동을 저지르는 뜻이에요."}, {"w": "prestigious", "k": "고급의", "s": "honored", "e": "She won a prestigious international award.", "n": "높은 명성과 존경을 받는 것을 뜻해요."}, {"w": "quirk", "k": "기벽", "s": "idiosyncrasy", "e": "One of his quirks is arranging books by color.", "n": "개인에게만 나타나는 독특하고 조금 이상한 습관이나 특징이에요."}, {"w": "resigned", "k": "단념한", "s": "reconciled", "e": "She gave a resigned sigh and accepted the decision.", "n": "바꿀 수 없는 상황을 체념하고 받아들이는 태도를 뜻해요."}, {"w": "sanction", "k": "승인하다", "s": "authorize", "e": "The committee sanctioned the new plan.", "n": "공식적으로 허가하거나 승인하는 뜻이에요."}, {"w": "showy", "k": "화려한", "s": "ostentatious", "e": "He disliked showy decorations.", "n": "눈에 띄게 화려해서 과시하는 듯한 것을 뜻해요."}, {"w": "spur", "k": "박차를 가하다", "s": "goad", "e": "The success spurred the team to work even harder.", "n": "사람이나 일을 더 빠르게 움직이도록 자극하는 뜻이에요."}, {"w": "subordinate", "k": "부하", "s": "assistant", "e": "The manager delegated the task to a subordinate.", "n": "조직에서 더 낮은 직위에 있는 사람을 뜻해요."}, {"w": "tenet", "k": "집단이 신봉하는 주의", "s": "doctrine", "e": "Freedom of expression is a central tenet of the organization.", "n": "집단이나 철학이 기본적으로 믿는 원칙을 뜻해요."}, {"w": "turncoat", "k": "변절자", "s": "betrayer", "e": "He was condemned as a turncoat after changing sides.", "n": "자신이 속했던 편을 버리고 반대편으로 간 사람을 뜻해요."}, {"w": "veer", "k": "방향을 홱 틀다", "s": "swerve", "e": "The car suddenly veered to the left.", "n": "진행 방향을 갑자기 바꾸는 뜻이에요."}, {"w": "zest", "k": "열성", "s": "ardor", "e": "She approached the project with zest.", "n": "일이나 삶에 대한 활기찬 열정과 즐거움을 뜻해요."}];
const quizOrder=[0, 3, 6, 9, 12, 16, 20, 24, 28, 34]; const recallOrder=[1, 5, 10, 14, 18, 23, 30, 35];
let learnIndex=0,quizIndex=0,recallIndex=0,score=0,total=0,missed=[];
const $=id=>document.getElementById(id);
function progress(p){$('bar').style.width=Math.max(0,Math.min(100,p))+'%'}
function renderLearn(){const x=words[learnIndex];$('learnCount').textContent=`LEARN ${learnIndex+1} / ${words.length}`;$('word').textContent=x.w;$('meaning').textContent=x.k;$('syn').textContent='Synonym: '+x.s;$('example').innerHTML=x.e.replace(new RegExp(x.w,'i'),m=>'<strong>'+m+'</strong>');$('note').textContent='💡 '+x.n;$('prevBtn').disabled=learnIndex===0;$('nextBtn').textContent=learnIndex===words.length-1?'Start Quiz →':'Next →';$('stepStat').textContent='Learn';progress((learnIndex/words.length)*45)}
$('prevBtn').onclick=()=>{if(learnIndex>0){learnIndex--;renderLearn()}};$('nextBtn').onclick=()=>{if(learnIndex<words.length-1){learnIndex++;renderLearn()}else showQuiz()};
function showQuiz(){$('learn').classList.add('hidden');$('quiz').classList.remove('hidden');$('stepStat').textContent='Quiz';renderQuiz()}
function renderQuiz(){const idx=quizOrder[quizIndex],x=words[idx];$('quizCount').textContent=`QUIZ ${quizIndex+1} / ${quizOrder.length}`;$('question').textContent=`Which word best matches: “${x.k}” ?`;$('feedback').textContent='';$('quizNext').classList.add('hidden');const pool=[idx];while(pool.length<4){const r=Math.floor(Math.random()*words.length);if(!pool.includes(r))pool.push(r)}pool.sort(()=>Math.random()-.5);const box=$('options');box.innerHTML='';pool.forEach(i=>{const b=document.createElement('button');b.type='button';b.className='option';b.textContent=words[i].w;b.onclick=()=>answerQuiz(b,i===idx,x);box.appendChild(b)});progress(45+(quizIndex/quizOrder.length)*30)}
function answerQuiz(btn,ok,x){if([...$('options').children].some(b=>b.disabled))return;[...$('options').children].forEach(b=>b.disabled=true);total++;if(ok){score++;btn.classList.add('correct');$('feedback').textContent=`✓ ${x.w} = ${x.k}. ${x.n}`}else{btn.classList.add('wrong');missed.push(x.w);[...$('options').children].forEach(b=>{if(b.textContent===x.w)b.classList.add('correct')});$('feedback').textContent=`정답은 ${x.w}. ${x.n}`}$('scoreStat').textContent='Score '+score;$('quizNext').classList.remove('hidden')}
$('quizNext').onclick=()=>{quizIndex++;if(quizIndex<quizOrder.length)renderQuiz();else showRecall()};
function showRecall(){$('quiz').classList.add('hidden');$('recall').classList.remove('hidden');$('stepStat').textContent='Recall';renderRecall()}
function renderRecall(){const x=words[recallOrder[recallIndex]];$('recallCount').textContent=`RECALL ${recallIndex+1} / ${recallOrder.length}`;$('recallPrompt').textContent=`${x.k} · synonym: ${x.s}`;$('recallInput').value='';$('recallInput').disabled=false;$('recallFeedback').textContent='';$('recallNext').classList.add('hidden');progress(75+(recallIndex/recallOrder.length)*25);setTimeout(()=>$('recallInput').focus(),50)}
$('recallForm').onsubmit=e=>{e.preventDefault();const x=words[recallOrder[recallIndex]],ans=$('recallInput').value.trim().toLowerCase();if(!ans)return;total++;$('recallInput').disabled=true;if(ans===x.w){score++;$('recallFeedback').textContent=`✓ Nice! “${x.w}” — ${x.k}`}else{missed.push(x.w);$('recallFeedback').textContent=`정답: ${x.w} — ${x.k}`}$('scoreStat').textContent='Score '+score;$('recallNext').classList.remove('hidden')};
$('recallNext').onclick=()=>{recallIndex++;if(recallIndex<recallOrder.length)renderRecall();else showResult()};
function showResult(){$('recall').classList.add('hidden');$('result').classList.remove('hidden');$('stepStat').textContent='Complete';progress(100);const pct=total?Math.round(score/total*100):0;$('finalScore').textContent=pct+'%';$('resultText').textContent=pct>=85?'Excellent — Day 13 cleared!':pct>=70?'Good work — review the missed words once more.':'One more review will make these stick.';const unique=[...new Set(missed)];$('reviewList').innerHTML=unique.length?unique.map(w=>{const x=words.find(v=>v.w===w);return `<div class="review-item"><strong>${x.w}</strong><span>${x.k}</span></div>`}).join(''):'<div class="review-item"><strong>Perfect!</strong><span>No missed words</span></div>'}
$('restart').onclick=()=>{learnIndex=0;quizIndex=0;recallIndex=0;score=0;total=0;missed=[];$('scoreStat').textContent='Score 0';$('result').classList.add('hidden');$('learn').classList.remove('hidden');renderLearn()};
renderLearn();
})();
</script>
</body></html>
