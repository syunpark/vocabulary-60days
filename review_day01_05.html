있는 말이에요.", "day": 5}, {"w": "preliminary", "k": "준비의, 예비의", "s": "initial", "e": "The researchers released preliminary results.", "n": "본격적인 단계 전에 이루어지는 초기·예비 단계를 뜻해요.", "day": 5}, {"w": "quarry", "k": "채석장", "s": "pit", "e": "Stone was extracted from a quarry outside the town.", "n": "돌이나 광물을 캐내는 큰 구덩이나 장소를 말해요.", "day": 5}, {"w": "reprove", "k": "타이르다, 꾸짖다", "s": "admonish", "e": "The teacher reproved him for speaking rudely.", "n": "잘못을 지적하며 점잖지만 분명하게 꾸짖는 뜻이에요.", "day": 5}, {"w": "rustle", "k": "살랑살랑 소리 내다", "s": "swish", "e": "The leaves rustled softly in the evening breeze.", "n": "종이·나뭇잎·천 등이 스치며 나는 가벼운 소리를 나타내요.", "day": 5}, {"w": "sheath", "k": "칼집, 덮개", "s": "cover", "e": "He slid the knife back into its sheath.", "n": "칼날 등을 보호하기 위해 씌우는 덮개를 뜻해요.", "day": 5}, {"w": "stalwart", "k": "충실한, 튼튼한", "s": "sturdy", "e": "She remained a stalwart supporter of the organization.", "n": "사람은 매우 충실하고 믿음직한, 물건은 튼튼한 뜻으로 써요.", "day": 5}, {"w": "stronghold", "k": "요새, 근거지", "s": "bulwark", "e": "The castle served as a stronghold during the conflict.", "n": "방어가 강한 요새나 어떤 세력의 핵심 근거지를 뜻해요.", "day": 5}, {"w": "tedious", "k": "지루한", "s": "boring", "e": "Entering the data by hand was a tedious task.", "n": "시간이 오래 걸리고 반복적이어서 지루한 것을 말해요.", "day": 5}, {"w": "trivial", "k": "하찮은, 사소한", "s": "unimportant", "e": "They argued over a trivial detail.", "n": "중요하지 않고 사소한 것을 뜻해요.", "day": 5}, {"w": "veracity", "k": "진실, 진실성", "s": "truthfulness", "e": "The reporter questioned the veracity of the claim.", "n": "말이나 정보가 진실한지 여부를 뜻하는 격식 있는 단어예요.", "day": 5}, {"w": "wry", "k": "비꼬는, 냉소적인", "s": "sarcastic", "e": "He gave a wry smile when he heard the excuse.", "n": "약간 비꼬거나 씁쓸한 유머가 담긴 태도를 말해요.", "day": 5}];
const pool=[6, 17, 27, 31, 35, 39, 43, 53, 59, 70, 72, 80, 89, 94, 105, 108, 115, 123, 130, 141, 144, 147, 154, 160, 178, 3, 8, 22, 28, 33, 41, 46, 62, 67, 71, 74, 85, 90, 98, 103, 111, 119, 126, 134, 139, 149, 157, 165, 172, 176];
let questions=[], qi=0, score=0, weak=[];
const $=id=>document.getElementById(id);

function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function addWeak(w){weak.push(w)}
function progress(){
  $('bar').style.width=((qi)/questions.length*100)+'%';
  $('countStat').textContent=Math.min(qi+1,questions.length)+' / '+questions.length;
}

function englishDefinition(x){
  // Use the supplied English synonym plus a concise English gloss derived from the existing study note.
  const map = {
    abandon:"to leave something completely",
    berate:"to criticize someone very severely",
    contrite:"feeling deeply sorry for a wrongdoing",
    deferential:"showing respectful submission",
    embezzle:"to steal money entrusted to you",
    imprudent:"not showing good judgment",
    misgiving:"a feeling of doubt or uneasiness",
    reprehensible:"deserving strong blame",
    rudimentary:"basic and not fully developed",
    stringent:"very strict or demanding",
    aghast:"filled with shock or horror",
    beseech:"to beg urgently",
    callow:"young and inexperienced",
    impudent:"rude and disrespectfully bold",
    neutralize:"to make something ineffective",
    perceive:"to notice or become aware of",
    repress:"to hold back or suppress",
    tarnish:"to damage a reputation or surface",
    winnow:"to separate out what is less useful",
    abdicate:"to give up a position of power",
    arduous:"requiring great effort",
    callous:"emotionally insensitive",
    dexterous:"skillful with the hands",
    foolhardy:"recklessly bold",
    impugn:"to challenge the honesty or validity of",
    mitigate:"to make something less severe",
    perennial:"lasting for a long time or recurring",
    qualm:"a feeling of doubt or moral unease",
    venerate:"to regard with deep respect",
    abash:"to make someone feel embarrassed",
    comprehensive:"covering all or nearly all aspects",
    deficient:"lacking enough of something",
    euphemism:"a mild expression used in place of a harsh one",
    hamper:"to hinder or obstruct",
    impunity:"freedom from punishment",
    mnemonic:"a device that helps memory",
    perfunctory:"done with little care or interest",
    superfluous:"more than necessary",
    abhor:"to hate intensely",
    bewildered:"very confused",
    candid:"honest and direct",
    converge:"to come together at one point",
    diverge:"to move apart in different directions",
    euphoria:"a feeling of intense happiness",
    germane:"relevant to the subject",
    hyperbole:"deliberate exaggeration for effect",
    nocturnal:"active at night",
    preliminary:"coming before the main part",
    tedious:"boring because it is long or repetitive",
    veracity:"truthfulness or accuracy"
  };
  return map[x.w] || `closest in meaning to “${x.s}”`;
}

function makeQuestions(){
  const chosen=pool.slice(0,40);
  questions=chosen.map((idx,pos)=>{
    if(pos<10) return {kind:'meaning',idx};
    if(pos<20) return {kind:'synonym',idx};
    if(pos<30) return {kind:'context',idx};
    return {kind:'recall',idx};
  });
  questions=shuffle(questions);
}

function distractors(target){
  const candidates=words.filter(x=>x.w!==target.w);
  const picked=[];
  while(picked.length<3){
    const x=candidates[Math.floor(Math.random()*candidates.length)];
    if(!picked.some(y=>y.w===x.w)) picked.push(x);
  }
  return picked;
}

function render(){
  progress();
  const q=questions[qi], x=words[q.idx];
  $('feedback').textContent='';
  $('nextBtn').classList.add('hidden');
  $('quizCard').dataset.tries='0';
  $('dayPill').textContent='DAY '+x.day;
  $('options').innerHTML='';
  $('answerInput').value='';
  $('answerInput').disabled=false;

  if(q.kind==='recall'){
    $('typePill').textContent='SPELLING RECALL';
    $('mcqArea').classList.add('hidden');
    $('inputArea').classList.remove('hidden');
    $('question').textContent=`Type the word that is closest in meaning to “${x.s}”.`;
    setTimeout(()=>$('answerInput').focus(),50);
    return;
  }

  $('mcqArea').classList.remove('hidden');
  $('inputArea').classList.add('hidden');

  if(q.kind==='meaning'){
    $('typePill').textContent='MEANING';
    $('question').textContent=`Which word means “${englishDefinition(x)}”?`;
  }
  if(q.kind==='synonym'){
    $('typePill').textContent='SYNONYM';
    $('question').textContent=`Which word is closest in meaning to “${x.s}”?`;
  }
  if(q.kind==='context'){
    $('typePill').textContent='CONTEXT';
    const blank=x.e.replace(new RegExp(x.w,'ig'),'_____');
    $('question').textContent=blank;
  }

  const opts=shuffle([x,...distractors(x)]);
  opts.forEach(o=>{
    const b=document.createElement('button');
    b.type='button';
    b.className='option';
    b.textContent=o.w;
    b.onclick=()=>answerMCQ(b,o.w===x.w,x,o);
    $('options').appendChild(b);
  });
}

function answerMCQ(btn,ok,x,selected){
  if(btn.disabled) return;

  if(ok){
    score++;
    [...$('options').children].forEach(b=>b.disabled=true);
    btn.classList.add('correct');
    $('feedback').textContent=`Correct! ${x.w} — ${x.k}`;
    $('scoreStat').textContent='Score '+score;
    $('nextBtn').classList.remove('hidden');
    return;
  }

  // Wrong choice: mark only that choice, explain that chosen word, and let the student retry.
  btn.classList.add('wrong');
  btn.disabled=true;
  addWeak(x.w);

  const tried = Number($('quizCard').dataset.tries || '0') + 1;
  $('quizCard').dataset.tries = String(tried);

  if(tried < 3){
    $('feedback').textContent=`Not quite. “${selected.w}” means “${selected.k}”. Try again.`;
  }else{
    // After 3 wrong attempts, reveal the answer and move on.
    [...$('options').children].forEach(b=>b.disabled=true);
    [...$('options').children].forEach(b=>{
      if(b.textContent===x.w) b.classList.add('correct');
    });
    $('feedback').textContent=`Not quite. “${selected.w}” means “${selected.k}”. The correct answer is “${x.w}” — ${x.k}.`;
    $('nextBtn').classList.remove('hidden');
  }
}

$('recallForm').onsubmit=e=>{
  e.preventDefault();
  const q=questions[qi], x=words[q.idx], ans=$('answerInput').value.trim().toLowerCase();
  if(!ans) return;

  if(ans===x.w.toLowerCase()){
    score++;
    $('answerInput').disabled=true;
    $('feedback').textContent=`Correct! ${x.w} — ${x.k}`;
    $('scoreStat').textContent='Score '+score;
    $('nextBtn').classList.remove('hidden');
    return;
  }

  addWeak(x.w);
  const typed=words.find(w=>w.w.toLowerCase()===ans);
  const tried = Number($('quizCard').dataset.tries || '0') + 1;
  $('quizCard').dataset.tries = String(tried);

  if(tried < 3){
    if(typed){
      $('feedback').textContent=`Not quite. “${typed.w}” means “${typed.k}”. Try again.`;
    }else{
      $('feedback').textContent='Not quite. Check the spelling and try again.';
    }
    $('answerInput').value='';
    $('answerInput').focus();
  }else{
    $('answerInput').disabled=true;
    if(typed){
      $('feedback').textContent=`Not quite. “${typed.w}” means “${typed.k}”. The correct answer is “${x.w}” — ${x.k}.`;
    }else{
      $('feedback').textContent=`Not quite. The correct answer is “${x.w}” — ${x.k}.`;
    }
    $('nextBtn').classList.remove('hidden');
  }
  $('scoreStat').textContent='Score '+score;
};

$('nextBtn').onclick=()=>{
  qi++;
  if(qi<questions.length) render();
  else showResult();
};

function showResult(){
  $('quizCard').classList.add('hidden');
  $('resultCard').classList.remove('hidden');
  $('bar').style.width='100%';
  const pct=Math.round(score/questions.length*100);
  $('finalScore').textContent=pct+'%';
  $('resultText').textContent=
    pct>=90?'Excellent — strong retention across Days 1–5!':
    pct>=75?'Good job — review the Weak Words once more.':
    'Keep going — focus on the Weak Words, then retry.';

  const uniq=[...new Set(weak)];
  $('weakList').innerHTML=uniq.length
    ? uniq.map(w=>{
        const x=words.find(v=>v.w===w);
        return `<div class="weakitem"><div><strong>${x.w}</strong><div class="tag">Day ${x.day} · ${x.s}</div></div><span>${x.k}</span></div>`;
      }).join('')
    : '<div class="weakitem"><strong>Perfect!</strong><span>No weak words</span></div>';
}

$('restartBtn').onclick=()=>{
  qi=0; score=0; weak=[];
  $('scoreStat').textContent='Score 0';
  $('resultCard').classList.add('hidden');
  $('quizCard').classList.remove('hidden');
  makeQuestions();
  render();
};

makeQuestions();
render();
})();
</script>

</body></html>
