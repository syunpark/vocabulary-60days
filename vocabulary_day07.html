<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vocabulary 101 · Day 07</title><style>
:root{color-scheme:light dark;--bg:#f7f8fb;--card:#fff;--text:#17191f;--muted:#6b7280;--line:#e5e7eb;--accent:#6757ff;--good:#16a34a;--bad:#dc2626}
@media(prefers-color-scheme:dark){:root{--bg:#101216;--card:#1b1f26;--text:#f8fafc;--muted:#aab0bb;--line:#303640}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:760px;margin:auto;padding:22px}
header{margin:14px 0 22px}.eyebrow{font-weight:800;letter-spacing:.12em;color:var(--accent)}h1{font-size:36px;margin:7px 0}.sub{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin:14px 0}.word{font-size:31px;font-weight:850}.syn{font-size:18px;color:var(--accent);font-weight:750;margin:6px 0 14px}.example{font-size:18px;line-height:1.55}button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:13px;padding:13px;cursor:pointer}button:hover{border-color:var(--accent)}.controls{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}.primary{background:var(--accent);color:white;border-color:var(--accent)}.hidden{display:none}.progress{height:9px;background:var(--line);border-radius:99px;overflow:hidden}.bar{height:100%;background:var(--accent);width:0}.option{display:block;width:100%;text-align:left;margin:9px 0}.wrong{border-color:var(--bad)}.correct{border-color:var(--good)}#feedback{min-height:48px;margin:12px 0;font-weight:700}.small{color:var(--muted);font-size:14px}
</style></head><body><main><header><div class="eyebrow">VOCABULARY 101 · DAY 07</div><h1>Learn → Quiz</h1><div class="sub">36 words · English-first practice</div></header>
<div class="progress"><div class="bar" id="bar"></div></div>
<section class="card" id="learn"><div class="small" id="counter"></div><div class="word" id="word"></div><div class="syn" id="syn"></div><div class="example" id="example"></div><div class="controls"><button id="prev">← Previous</button><button class="primary" id="next">Next →</button></div></section>
<section class="card hidden" id="quiz"><div class="small" id="qcount"></div><h2 id="question"></h2><div id="options"></div><div id="feedback"></div><button class="primary hidden" id="qnext">Next →</button></section>
<section class="card hidden" id="result"><h2>Day 07 Complete 🎉</h2><p id="score"></p><h3>Weak Words</h3><div id="weak"></div><div class="controls"><button class="primary" onclick="location.reload()">Practice Again</button></div></section>
</main><script>
const words=[{"w": "aboveboard", "k": "정정당당한", "s": "honest", "e": "The entire negotiation was open and aboveboard."}, {"w": "affinity", "k": "친밀감", "s": "liking", "e": "She felt an immediate affinity with the new team."}, {"w": "arouse", "k": "일깨우다", "s": "awaken", "e": "The strange discovery began to arouse public curiosity."}, {"w": "bigoted", "k": "고집 센", "s": "opinionated", "e": "The article criticized his bigoted remarks."}, {"w": "candor", "k": "솔직함", "s": "honesty", "e": "I appreciated her candor about the project's difficulties."}, {"w": "commiserate", "k": "위로하다", "s": "condole", "e": "Friends gathered to commiserate with him after the loss."}, {"w": "convincing", "k": "설득력 있는", "s": "assuring", "e": "She presented a convincing argument supported by evidence."}, {"w": "deity", "k": "신", "s": "god", "e": "The ancient temple was dedicated to a local deity."}, {"w": "diffident", "k": "수줍은", "s": "timid", "e": "The diffident student rarely volunteered to speak first."}, {"w": "diversion", "k": "기분 전환", "s": "recreation", "e": "Reading can provide a pleasant diversion from routine."}, {"w": "emphatic", "k": "어조가 강한", "s": "forceful", "e": "The coach was emphatic that everyone must arrive on time."}, {"w": "evanescent", "k": "덧없는", "s": "transitory", "e": "The rainbow was beautiful but evanescent."}, {"w": "fallacy", "k": "그릇된 생각", "s": "misconception", "e": "The evidence exposed a serious fallacy in his reasoning."}, {"w": "foreboding", "k": "예감", "s": "omen", "e": "She had a sense of foreboding before the storm."}, {"w": "ghetto", "k": "빈민가", "s": "slum", "e": "The novel describes life in an impoverished urban ghetto."}, {"w": "haphazard", "k": "아무렇게나", "s": "random", "e": "The books were stacked in a haphazard manner."}, {"w": "hypocrisy", "k": "위선", "s": "insincerity", "e": "He was accused of hypocrisy for ignoring his own advice."}, {"w": "inalienable", "k": "떨어뜨릴 수 없는", "s": "inviolable", "e": "The declaration describes liberty as an inalienable right."}, {"w": "infirmity", "k": "병약", "s": "frailty", "e": "Age and infirmity made the long journey difficult."}, {"w": "intimidate", "k": "협박하다", "s": "browbeat", "e": "The threats were intended to intimidate the witness."}, {"w": "lenient", "k": "관대한", "s": "tolerant", "e": "The teacher was lenient about the first late assignment."}, {"w": "mandatory", "k": "법에 정해진", "s": "obligatory", "e": "Attendance at the safety briefing is mandatory."}, {"w": "modest", "k": "겸손한", "s": "humble", "e": "Despite her success, she remained modest."}, {"w": "nonchalant", "k": "무관심한", "s": "casual", "e": "He appeared nonchalant despite the pressure."}, {"w": "ostentatious", "k": "자랑 삼아 드러내는", "s": "showy", "e": "They avoided ostentatious displays of wealth."}, {"w": "penury", "k": "극빈", "s": "destitution", "e": "The family struggled through years of penury."}, {"w": "premiere", "k": "초연", "s": "opening", "e": "The film's premiere attracted a large audience."}, {"w": "queasy", "k": "멀미하는 것 같은", "s": "nauseous", "e": "The rough boat ride made several passengers feel queasy."}, {"w": "repulse", "k": "격퇴하다", "s": "repel", "e": "The defenders managed to repulse the attack."}, {"w": "safeguard", "k": "안전 장치", "s": "protection", "e": "Strong passwords are an important safeguard against unauthorized access."}, {"w": "shed", "k": "흘리다", "s": "drop", "e": "The trees shed their leaves in autumn."}, {"w": "shiver", "k": "(몸을) 떨다", "s": "shake", "e": "A cold wind made her shiver."}, {"w": "studious", "k": "열심인", "s": "diligent", "e": "He was a studious teenager who spent hours reading."}, {"w": "temperate", "k": "절제하는", "s": "moderate", "e": "Her temperate habits helped her maintain a balanced routine."}, {"w": "truant", "k": "무단결석자", "s": "absentee", "e": "The truant was returned to school by an attendance officer."}, {"w": "verbose", "k": "말이 많은", "s": "garrulous", "e": "The report was accurate but unnecessarily verbose."}];let i=0,qs=[],qi=0,score=0,weak=[],$=x=>document.getElementById(x);
function showWord(){let x=words[i];$('counter').textContent=`Word ${i+1} / ${words.length}`;$('word').textContent=x.w;$('syn').textContent=`≈ ${x.s}`;$('example').textContent=x.e;$('bar').style.width=((i+1)/words.length*50)+'%';$('prev').disabled=i===0;$('next').textContent=i===words.length-1?'Start Quiz →':'Next →'}
$('prev').onclick=()=>{if(i){i--;showWord()}};$('next').onclick=()=>{if(i<words.length-1){i++;showWord()}else startQuiz()};
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function startQuiz(){$('learn').classList.add('hidden');$('quiz').classList.remove('hidden');qs=shuffle(words).slice(0,18);renderQ()}
function renderQ(){let x=qs[qi];$('qcount').textContent=`Question ${qi+1} / ${qs.length}`;$('question').textContent=`Which word is closest in meaning to “${x.s}”?`;$('feedback').textContent='';$('qnext').classList.add('hidden');let ds=shuffle(words.filter(y=>y.w!==x.w)).slice(0,3),opts=shuffle([x,...ds]);$('options').innerHTML='';opts.forEach(o=>{let b=document.createElement('button');b.className='option';b.textContent=o.w;b.onclick=()=>answer(b,o,x);$('options').appendChild(b)});$('bar').style.width=(50+(qi/qs.length*50))+'%'}
function answer(b,o,x){if(b.disabled)return;if(o.w===x.w){score++;[...$('options').children].forEach(z=>z.disabled=true);b.classList.add('correct');$('feedback').textContent=`Correct! ${x.w} — ${x.k}`;$('qnext').classList.remove('hidden')}else{b.disabled=true;b.classList.add('wrong');weak.push(x.w);$('feedback').textContent=`Not quite. “${o.w}” means “${o.k}”. Try again.`}}
$('qnext').onclick=()=>{qi++;if(qi<qs.length)renderQ();else finish()};function finish(){$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('bar').style.width='100%';$('score').textContent=`Score: ${score} / ${qs.length}`;let u=[...new Set(weak)];$('weak').innerHTML=u.length?u.map(w=>{let x=words.find(z=>z.w===w);return `<p><b>${x.w}</b> · ${x.s} · ${x.k}</p>`}).join(''):'<p>No weak words — excellent!</p>'}showWord();
</script></body></html>
