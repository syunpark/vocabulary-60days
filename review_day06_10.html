": "법정에서 선서 후 거짓말하는 범죄를 뜻해요.", "day": 10}, {"w": "plastic", "k": "형태를 만들기가 쉬운", "s": "malleable", "e": "The material is plastic enough to be shaped by hand.", "n": "쉽게 모양을 바꾸거나 성형할 수 있다는 뜻이에요.", "day": 10}, {"w": "query", "k": "질문", "s": "question", "e": "The customer sent a query about the bill.", "n": "정보를 얻기 위해 하는 질문이나 문의를 뜻해요.", "day": 10}, {"w": "requisite", "k": "필요한", "s": "necessary", "e": "Patience is requisite for this kind of work.", "n": "어떤 목적을 위해 반드시 필요한 것을 뜻해요.", "day": 10}, {"w": "salvation", "k": "구조", "s": "deliverance", "e": "The stranded hikers saw the rescue helicopter as their salvation.", "n": "위험·고통·죄에서 구해지는 것을 뜻해요.", "day": 10}, {"w": "shimmer", "k": "부드럽게 빛나다", "s": "gleam", "e": "Moonlight shimmered on the lake.", "n": "빛이 흔들리듯 은은하게 반짝이는 모습을 뜻해요.", "day": 10}, {"w": "spontaneous", "k": "자발적인", "s": "impulsive", "e": "The audience gave a spontaneous round of applause.", "n": "미리 계획하지 않고 자연스럽게 일어나는 것을 뜻해요.", "day": 10}, {"w": "subdue", "k": "정복하다", "s": "quell", "e": "The guards managed to subdue the attacker.", "n": "힘이나 통제로 상대를 제압하고 억누르는 뜻이에요.", "day": 10}, {"w": "tenable", "k": "공격에 견딜 수 있는, 옹호 가능한", "s": "secured", "e": "The argument is no longer tenable after the new evidence.", "n": "논리적으로 방어하거나 유지할 수 있는 입장·주장을 뜻해요.", "day": 10}, {"w": "tumult", "k": "소동", "s": "uproar", "e": "A tumult broke out after the controversial decision.", "n": "큰 소리와 혼란이 뒤섞인 소동을 뜻해요.", "day": 10}, {"w": "vernacular", "k": "자국어의", "s": "dialect", "e": "The author wrote in the local vernacular.", "n": "특정 지역이나 집단이 일상적으로 사용하는 언어를 뜻해요.", "day": 10}, {"w": "zealot", "k": "열광자", "s": "partisan", "e": "The political zealot refused to consider opposing views.", "n": "특정 신념을 지나치게 열성적으로 지지하는 사람을 뜻해요.", "day": 10}];
const pool=[0, 4, 8, 13, 17, 22, 27, 34, 36, 40, 44, 49, 53, 58, 63, 70, 72, 76, 80, 85, 89, 94, 99, 106, 108, 112, 116, 121, 125, 130, 135, 142, 144, 148, 152, 157, 161, 166, 171, 178];
const defs={"abominable": "extremely unpleasant or hateful", "cantankerous": "bad-tempered and argumentative", "degenerate": "to become worse in quality or condition", "hangar": "a large building used to house aircraft", "intimate": "to suggest or imply indirectly", "nomad": "a person who moves from place to place rather than settling permanently", "repudiate": "to reject or refuse to accept something", "verbalize": "to express thoughts or feelings in words", "aboveboard": "open, honest, and fair", "candor": "the quality of being honest and direct", "fallacy": "a mistaken belief or faulty idea", "foreboding": "a feeling that something bad may happen", "inalienable": "unable to be taken away or transferred", "modest": "not boastful about one's abilities or achievements", "queasy": "feeling sick or nauseous", "truant": "a student who stays away from school without permission", "abridge": "to shorten a text while keeping its main ideas", "capitulate": "to stop resisting and surrender", "diffuse": "to spread over a wide area", "homage": "special honor or respect shown publicly", "ingenious": "clever, original, and inventive", "mortify": "to cause someone to feel extremely embarrassed", "quell": "to put an end to a disturbance or strong feeling", "verdict": "an official decision reached in a court", "absolve": "to free someone from blame or responsibility", "capricious": "changing suddenly and unpredictably", "falter": "to lose strength or confidence and hesitate", "forestall": "to prevent something by acting in advance", "ingenuity": "cleverness in designing or solving something", "preoccupied": "deeply absorbed in thought", "retaliate": "to respond to harm by doing harm in return", "verify": "to confirm that something is true or accurate", "abstain": "to choose not to do or take part in something", "carnivorous": "feeding mainly on meat", "dilapidated": "in very poor condition because of age or neglect", "forewarn": "to warn someone in advance", "ingenuous": "innocent, honest, and straightforward", "perjury": "the crime of lying under oath", "subdue": "to bring under control by force", "vernacular": "the language or dialect commonly spoken in a particular place"};
let questions=[],qi=0,score=0,weak=[];
const $=id=>document.getElementById(id);
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function addWeak(w){weak.push(w)}
function progress(){$('bar').style.width=((qi)/questions.length*100)+'%';$('countStat').textContent=Math.min(qi+1,questions.length)+' / '+questions.length}
function makeQuestions(){
  questions=pool.map((idx,pos)=>{
    if(pos<10)return{kind:'meaning',idx};
    if(pos<20)return{kind:'synonym',idx};
    if(pos<30)return{kind:'context',idx};
    return{kind:'recall',idx};
  });
  questions=shuffle(questions);
}
function distractors(target){
  const c=words.filter(x=>x.w!==target.w),picked=[];
  while(picked.length<3){const x=c[Math.floor(Math.random()*c.length)];if(!picked.some(y=>y.w===x.w))picked.push(x)}
  return picked;
}
function render(){
  progress();const q=questions[qi],x=words[q.idx];
  $('feedback').textContent='';$('nextBtn').classList.add('hidden');$('quizCard').dataset.tries='0';$('dayPill').textContent='DAY '+x.day;
  $('options').innerHTML='';$('answerInput').value='';$('answerInput').disabled=false;
  if(q.kind==='recall'){
    $('typePill').textContent='SPELLING RECALL';$('mcqArea').classList.add('hidden');$('inputArea').classList.remove('hidden');
    $('question').textContent=`Type the word that is closest in meaning to “${x.s}”.`;setTimeout(()=>$('answerInput').focus(),50);return;
  }
  $('mcqArea').classList.remove('hidden');$('inputArea').classList.add('hidden');
  if(q.kind==='meaning'){$('typePill').textContent='MEANING';$('question').textContent=`Which word means “${defs[x.w]||('closest in meaning to '+x.s)}”?`}
  if(q.kind==='synonym'){$('typePill').textContent='SYNONYM';$('question').textContent=`Which word is closest in meaning to “${x.s}”?`}
  if(q.kind==='context'){$('typePill').textContent='CONTEXT';$('question').textContent=x.e.replace(new RegExp(x.w,'ig'),'_____')}
  const opts=shuffle([x,...distractors(x)]);
  opts.forEach(o=>{const b=document.createElement('button');b.type='button';b.className='option';b.textContent=o.w;b.onclick=()=>answerMCQ(b,o.w===x.w,x,o);$('options').appendChild(b)})
}
function answerMCQ(btn,ok,x,selected){
  if(btn.disabled)return;
  if(ok){
    score++;[...$('options').children].forEach(b=>b.disabled=true);btn.classList.add('correct');
    $('feedback').textContent=`Correct! ${x.w} — ${x.k}`;$('scoreStat').textContent='Score '+score;$('nextBtn').classList.remove('hidden');return;
  }
  btn.classList.add('wrong');btn.disabled=true;addWeak(x.w);
  const tried=Number($('quizCard').dataset.tries||'0')+1;$('quizCard').dataset.tries=String(tried);
  if(tried<3){$('feedback').textContent=`Not quite. “${selected.w}” means “${selected.k}”. Try again.`}
  else{[...$('options').children].forEach(b=>b.disabled=true);[...$('options').children].forEach(b=>{if(b.textContent===x.w)b.classList.add('correct')});$('feedback').textContent=`Not quite. “${selected.w}” means “${selected.k}”. The correct answer is “${x.w}” — ${x.k}.`;$('nextBtn').classList.remove('hidden')}
}
$('recallForm').onsubmit=e=>{
  e.preventDefault();const q=questions[qi],x=words[q.idx],ans=$('answerInput').value.trim().toLowerCase();if(!ans)return;
  if(ans===x.w.toLowerCase()){score++;$('answerInput').disabled=true;$('feedback').textContent=`Correct! ${x.w} — ${x.k}`;$('scoreStat').textContent='Score '+score;$('nextBtn').classList.remove('hidden');return}
  addWeak(x.w);const typed=words.find(w=>w.w.toLowerCase()===ans);const tried=Number($('quizCard').dataset.tries||'0')+1;$('quizCard').dataset.tries=String(tried);
  if(tried<3){$('feedback').textContent=typed?`Not quite. “${typed.w}” means “${typed.k}”. Try again.`:'Not quite. Check the spelling and try again.';$('answerInput').value='';$('answerInput').focus()}
  else{$('answerInput').disabled=true;$('feedback').textContent=typed?`Not quite. “${typed.w}” means “${typed.k}”. The correct answer is “${x.w}” — ${x.k}.`:`Not quite. The correct answer is “${x.w}” — ${x.k}.`;$('nextBtn').classList.remove('hidden')}
  $('scoreStat').textContent='Score '+score
};
$('nextBtn').onclick=()=>{qi++;if(qi<questions.length)render();else showResult()};
function showResult(){
  $('quizCard').classList.add('hidden');$('resultCard').classList.remove('hidden');$('bar').style.width='100%';
  const pct=Math.round(score/questions.length*100);$('finalScore').textContent=pct+'%';
  $('resultText').textContent=pct>=90?'Excellent — strong retention across Days 6–10!':pct>=75?'Good job — review the Weak Words once more.':'Keep going — focus on the Weak Words, then retry.';
  const uniq=[...new Set(weak)];
  $('weakList').innerHTML=uniq.length?uniq.map(w=>{const x=words.find(v=>v.w===w);return `<div class="weakitem"><div><strong>${x.w}</strong><div class="tag">Day ${x.day} · ${x.s}</div></div><span>${x.k}</span></div>`}).join(''):'<div class="weakitem"><strong>Perfect!</strong><span>No weak words</span></div>'
}
$('restartBtn').onclick=()=>{qi=0;score=0;weak=[];$('scoreStat').textContent='Score 0';$('resultCard').classList.add('hidden');$('quizCard').classList.remove('hidden');makeQuestions();render()};
makeQuestions();render();
})();
</script></body></html>
