<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vocabulary 101 · Review 03 · Days 11–15</title>
<style>
:root{color-scheme:light dark;--bg:#f7f8fb;--text:#17191f;--muted:#69707d;--card:#fff;--border:#e5e8ef;--soft:#f2f4f7;--accent:#6b57ff;--accent2:#3da8ff;--good:#2ca35f;--goodbg:#dff7e6;--bad:#d5535c;--badbg:#fde4e6}
@media(prefers-color-scheme:dark){:root{--bg:#111317;--text:#f6f7f9;--muted:#adb4c0;--card:#1b1f26;--border:#2b3038;--soft:#252a32;--goodbg:#173d25;--badbg:#4a1d22}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{padding:24px} .wrap{max-width:880px;margin:auto}
.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;flex-wrap:wrap;margin-bottom:18px}
h1{margin:5px 0;font-size:30px}
.sub{color:var(--muted);font-size:14px}
.pill{display:inline-flex;padding:6px 10px;border-radius:999px;background:var(--soft);font-size:12px;font-weight:800;color:var(--muted)}
.progress{height:10px;background:var(--border);border-radius:999px;overflow:hidden;margin:12px 0 20px}
.bar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .25s}
.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:22px;box-shadow:0 8px 24px rgba(0,0,0,.05)}
.question{font-size:23px;font-weight:850;line-height:1.35;margin:14px 0}
.meta{display:flex;gap:8px;flex-wrap:wrap}
.options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
button{appearance:none;border:none;border-radius:14px;padding:13px 16px;min-height:44px;font-size:15px;font-weight:750;cursor:pointer}
.option{background:var(--soft);color:var(--text);text-align:left;border:1px solid transparent}
.option.correct{background:var(--goodbg);border-color:var(--good)}
.option.wrong{background:var(--badbg);border-color:var(--bad)}
.primary{background:var(--accent);color:#fff}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.feedback{min-height:24px;margin-top:14px;line-height:1.5;font-size:14px}
input{width:100%;padding:14px 15px;border-radius:14px;border:1px solid var(--border);font-size:17px;background:var(--card);color:var(--text)}
.hidden{display:none!important}
.score{font-size:58px;font-weight:900;margin:10px 0}
.center{text-align:center}
.weak{display:grid;gap:8px;margin-top:16px}
.weakitem{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:12px;background:var(--soft);text-align:left}
.tag{font-size:12px;color:var(--muted)}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{padding:8px 10px;background:var(--soft);border-radius:12px;font-size:13px;font-weight:750}
@media(max-width:600px){.app{padding:16px}.options{grid-template-columns:1fr}.card{padding:18px}h1{font-size:27px}}
</style>
</head>
<body>
<div class="app"><div class="wrap">
<div class="top">
  <div>
    <span class="pill">REVIEW 03 · DAYS 11–15</span>
    <h1>Vocabulary Challenge</h1>
    <div class="sub">40 questions · English Meaning · Synonym · Context · Spelling Recall</div>
  </div>
  <div class="stats">
    <div class="stat" id="countStat">1 / 40</div>
    <div class="stat" id="scoreStat">Score 0</div>
  </div>
</div>

<div class="progress"><div class="bar" id="bar"></div></div>

<section id="quizCard" class="card">
  <div class="meta"><span class="pill" id="typePill">QUIZ</span><span class="pill" id="dayPill">DAY</span></div>
  <div class="question" id="question"></div>
  <div id="mcqArea"><div class="options" id="options"></div></div>
  <div id="inputArea" class="hidden">
    <form id="recallForm">
      <input id="answerInput" autocomplete="off" spellcheck="false" placeholder="Type the English word">
      <div class="actions"><button class="primary" type="submit">Check</button></div>
    </form>
  </div>
  <div class="feedback" id="feedback" aria-live="polite"></div>
  <div class="actions"><button id="nextBtn" class="primary hidden" type="button">Next →</button></div>
</section>

<section id="resultCard" class="card hidden center">
  <span class="pill">REVIEW 03 COMPLETE</span>
  <div class="score" id="finalScore"></div>
  <div style="font-size:19px;font-weight:800" id="resultText"></div>
  <div class="sub" style="margin-top:7px">Focus on the Weak Words below, then try the challenge again.</div>
  <div class="weak" id="weakList"></div>
  <div class="actions" style="justify-content:center"><button id="restartBtn" class="primary" type="button">Try Review Again</button></div>
</section>
</div></div>

ptuous", "k": "주제넘은", "s": "audacious", "e": "It was presumptuous of him to speak for everyone.", "n": "권한이나 자격 없이 지나치게 나서는 태도를 뜻해요.", "day": 15}, {"w": "quintessence", "k": "핵심", "s": "essence", "e": "The village is the quintessence of rural charm.", "n": "어떤 것의 가장 순수하고 대표적인 핵심을 뜻해요.", "day": 15}, {"w": "recluse", "k": "은둔자", "s": "hermit", "e": "The famous author lived as a recluse for many years.", "n": "사람들과 거의 어울리지 않고 혼자 지내는 사람을 뜻해요.", "day": 15}, {"w": "seasoned", "k": "경험 많은", "s": "experienced", "e": "She is a seasoned negotiator.", "n": "오랜 경험으로 능숙하고 노련한 것을 뜻해요.", "day": 15}, {"w": "shrewd", "k": "기민한", "s": "sharp", "e": "He made a shrewd business decision.", "n": "상황을 빠르게 파악하고 영리하게 판단하는 능력을 뜻해요.", "day": 15}, {"w": "spurn", "k": "쫓아내다", "s": "reject", "e": "She spurned the offer immediately.", "n": "제안이나 사람을 강하게 거절하거나 물리치는 뜻이에요.", "day": 15}, {"w": "subservient", "k": "비굴한", "s": "submissive", "e": "He refused to take a subservient role.", "n": "지나치게 복종하며 자신의 의견을 내세우지 못하는 태도를 뜻해요.", "day": 15}, {"w": "tenuous", "k": "희박한", "s": "feeble", "e": "The evidence supporting the claim was tenuous.", "n": "연결·근거·가능성이 약하고 불확실한 것을 뜻해요.", "day": 15}, {"w": "vessel", "k": "배", "s": "ship", "e": "The vessel sailed across the harbor at dawn.", "n": "배나 큰 선박을 뜻해요.", "day": 15}];
const pool=[0, 4, 8, 13, 17, 22, 27, 34, 36, 40, 44, 49, 53, 58, 63, 70, 72, 76, 80, 85, 89, 94, 99, 106, 108, 112, 116, 121, 125, 130, 135, 142, 144, 148, 152, 157, 161, 166, 171, 178];
const defs={"abstract": "a short summary of the main points", "carnage": "the killing of many people in a violent event", "dilemma": "a difficult choice between two or more options", "feud": "a long and bitter conflict between people or groups", "ingrained": "deeply established and difficult to change", "nonplussed": "so surprised or confused that one does not know how to react", "resent": "to feel anger or bitterness about unfair treatment", "verse": "writing arranged in lines with rhythm, as in poetry", "abstruse": "difficult to understand because it is complex", "cascade": "a small waterfall or something falling in stages", "dilatory": "slow to act because of delay or procrastination", "forgo": "to choose to do without something", "inhabit": "to live in or occupy a place", "quota": "a fixed amount or share that is assigned", "reserved": "quiet and not showing feelings easily", "vertex": "the highest point or the point where lines meet", "absurd": "completely unreasonable or ridiculous", "celerity": "great speed or swiftness", "dogmatic": "stubbornly certain that one's beliefs are correct", "glance": "to look quickly or briefly", "inhumane": "cruel and lacking compassion", "quirk": "an unusual habit or characteristic", "resigned": "accepting an unpleasant situation because it cannot be changed", "veer": "to change direction suddenly", "abundant": "existing in large quantities", "catastrophe": "a sudden event causing great damage or suffering", "diminutive": "very small", "fortify": "to strengthen or protect", "inception": "the beginning of something", "preposterous": "so unreasonable that it is hard to believe", "spurious": "false or not genuine", "tentative": "not final or certain; provisional", "afflict": "to cause pain or trouble over a period of time", "cater": "to provide what a particular group needs or wants", "dingy": "dark, dirty, and unattractive", "fortitude": "courage in the face of pain or difficulty", "incessant": "continuing without stopping", "perplex": "to make someone confused", "presumptuous": "too confident in acting without proper right or permission", "tenuous": "weak, slight, or not well supported"};
let questions=[], qi=0, score=0, weak=[];
const $=id=>document.getElementById(id);

function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function addWeak(w){weak.push(w)}
function progress(){
  $('bar').style.width=((qi)/questions.length*100)+'%';
  $('countStat').textContent=Math.min(qi+1,questions.length)+' / '+questions.length;
}
function makeQuestions(){
  questions=pool.map((idx,pos)=>{
    if(pos<10)return{kind:'meaning',idx};
    if(pos<20)return{kind:'synonym',idx};
    if(pos<30)return{kind:'context',idx};
    return{kind:'recall',idx};
  });
  questions=shuffle(questions);
}
function distractors(target){
  const c=words.filter(x=>x.w!==target.w), picked=[];
  while(picked.length<3){
    const x=c[Math.floor(Math.random()*c.length)];
    if(!picked.some(y=>y.w===x.w))picked.push(x);
  }
  return picked;
}
function render(){
  progress();
  const q=questions[qi], x=words[q.idx];
  $('feedback').textContent='';
  $('nextBtn').classList.add('hidden');
  $('quizCard').dataset.tries='0';
  $('dayPill').textContent='DAY '+x.day;
  $('options').innerHTML='';
  $('answerInput').value='';
  $('answerInput').disabled=false;

  if(q.kind==='recall'){
    $('typePill').textContent='SPELLING RECALL';
    $('mcqArea').classList.add('hidden');
    $('inputArea').classList.remove('hidden');
    $('question').textContent=`Type the word that is closest in meaning to “${x.s}”.`;
    setTimeout(()=>$('answerInput').focus(),50);
    return;
  }

  $('mcqArea').classList.remove('hidden');
  $('inputArea').classList.add('hidden');

  if(q.kind==='meaning'){
    $('typePill').textContent='MEANING';
    $('question').textContent=`Which word means “${defs[x.w]||('closest in meaning to '+x.s)}”?`;
  }
  if(q.kind==='synonym'){
    $('typePill').textContent='SYNONYM';
    $('question').textContent=`Which word is closest in meaning to “${x.s}”?`;
  }
  if(q.kind==='context'){
    $('typePill').textContent='CONTEXT';
    $('question').textContent=x.e.replace(new RegExp(x.w,'ig'),'_____');
  }

  const opts=shuffle([x,...distractors(x)]);
  opts.forEach(o=>{
    const b=document.createElement('button');
    b.type='button';
    b.className='option';
    b.textContent=o.w;
    b.onclick=()=>answerMCQ(b,o.w===x.w,x,o);
    $('options').appendChild(b);
  });
}

function answerMCQ(btn,ok,x,selected){
  if(btn.disabled)return;

  if(ok){
    score++;
    [...$('options').children].forEach(b=>b.disabled=true);
    btn.classList.add('correct');
    $('feedback').textContent=`Correct! ${x.w} — ${x.k}`;
    $('scoreStat').textContent='Score '+score;
    $('nextBtn').classList.remove('hidden');
    return;
  }

  btn.classList.add('wrong');
  btn.disabled=true;
  addWeak(x.w);

  const tried=Number($('quizCard').dataset.tries||'0')+1;
  $('quizCard').dataset.tries=String(tried);

  if(tried<3){
    $('feedback').textContent=`Not quite. “${selected.w}” means “${selected.k}”. Try again.`;
  }else{
    [...$('options').children].forEach(b=>b.disabled=true);
    [...$('options').children].forEach(b=>{if(b.textContent===x.w)b.classList.add('correct')});
    $('feedback').textContent=`Not quite. “${selected.w}” means “${selected.k}”. The correct answer is “${x.w}” — ${x.k}.`;
    $('nextBtn').classList.remove('hidden');
  }
}

$('recallForm').onsubmit=e=>{
  e.preventDefault();
  const q=questions[qi], x=words[q.idx], ans=$('answerInput').value.trim().toLowerCase();
  if(!ans)return;

  if(ans===x.w.toLowerCase()){
    score++;
    $('answerInput').disabled=true;
    $('feedback').textContent=`Correct! ${x.w} — ${x.k}`;
    $('scoreStat').textContent='Score '+score;
    $('nextBtn').classList.remove('hidden');
    return;
  }

  addWeak(x.w);
  const typed=words.find(w=>w.w.toLowerCase()===ans);
  const tried=Number($('quizCard').dataset.tries||'0')+1;
  $('quizCard').dataset.tries=String(tried);

  if(tried<3){
    $('feedback').textContent=typed
      ? `Not quite. “${typed.w}” means “${typed.k}”. Try again.`
      : 'Not quite. Check the spelling and try again.';
    $('answerInput').value='';
    $('answerInput').focus();
  }else{
    $('answerInput').disabled=true;
    $('feedback').textContent=typed
      ? `Not quite. “${typed.w}” means “${typed.k}”. The correct answer is “${x.w}” — ${x.k}.`
      : `Not quite. The correct answer is “${x.w}” — ${x.k}.`;
    $('nextBtn').classList.remove('hidden');
  }
  $('scoreStat').textContent='Score '+score;
};

$('nextBtn').onclick=()=>{
  qi++;
  if(qi<questions.length)render();
  else showResult();
};

function showResult(){
  $('quizCard').classList.add('hidden');
  $('resultCard').classList.remove('hidden');
  $('bar').style.width='100%';
  const pct=Math.round(score/questions.length*100);
  $('finalScore').textContent=pct+'%';
  $('resultText').textContent=
    pct>=90 ? 'Excellent — strong retention across Days 11–15!' :
    pct>=75 ? 'Good job — review the Weak Words once more.' :
              'Keep going — focus on the Weak Words, then retry.';

  const uniq=[...new Set(weak)];
  $('weakList').innerHTML=uniq.length
    ? uniq.map(w=>{
        const x=words.find(v=>v.w===w);
        return `<div class="weakitem"><div><strong>${x.w}</strong><div class="tag">Day ${x.day} · ${x.s}</div></div><span>${x.k}</span></div>`;
      }).join('')
    : '<div class="weakitem"><strong>Perfect!</strong><span>No weak words</span></div>';
}

$('restartBtn').onclick=()=>{
  qi=0; score=0; weak=[];
  $('scoreStat').textContent='Score 0';
  $('resultCard').classList.add('hidden');
  $('quizCard').classList.remove('hidden');
  makeQuestions();
  render();
};

makeQuestions();
render();
})();
</script>
</body>
</html>
